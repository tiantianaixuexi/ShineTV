<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ShineTV Studio 项目管理、小说、资产、分镜、出图、出片和审阅的交互设计。">
<title>ShineTV Studio · 界面设计稿</title>
<style>
/* Hallmark · theme: Bloom · shape: app screen · genre: atmospheric · redesign: full · v2.1.0 */
/* Critique: the prior dashboard gave each region the same weight. Here the project index, manuscript, footage and task board each lead their own screen. */
:root{
  color-scheme:light;
  --bg:#f4efe6;--surface:#ebe3d6;--panel:#fffdf8;--raised:#fffdf8;
  --line:#d0c3b4;--ink:#28211c;--quiet:#54483e;--dim:#716458;
  --accent:#973b29;--accent-hover:#7e2f20;--accent-ink:#fff8f1;--accent-bg:#f4dfd3;
  --warn:#77491f;--matte:#292422;--matte-paper:#f2e9df;--flow-grid:#8f766238;
  --scrim:#281a12a8;--bright:#fff8f1;--selection-line:#a1513a;
  --tool:#3b3129;--tool-border:#615045;--focus:#973b29;--field:#8c7768;
  --disabled-bg:#ded4c8;--disabled-ink:#605245;
  --ok:#3e6b40;--ok-bg:#e7eede;--danger:#992c1e;--danger-bg:#f6e0da;
  --info:#3c566e;--info-bg:#e4eaf0;--warn-bg:#f6e9d3;--warn-line:#c49a5f;
  --art-warm-1:#8a4a35;--art-warm-2:#a2624a;--art-cool-1:#4c5b63;--art-cool-2:#66787f;
  --font-ui:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  --font-reader:"Noto Serif CJK SC","Songti SC",SimSun,serif;
  --font-mono:Consolas,"Microsoft YaHei UI",monospace;
  --radius:6px;
}
html,body{overflow-x:clip}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-ui)}
button,input,select,textarea{font:inherit}
button,input,select,textarea{
  min-width:0;min-height:36px;border:1px solid var(--line);
  color:inherit;background:var(--panel)
}
button,select{padding:4px 12px;white-space:nowrap;border-radius:var(--radius)}
button{cursor:pointer}
button:hover{background:var(--surface)}
button:active{background:var(--accent-bg)}
button:disabled,button[aria-disabled=true]{background:var(--disabled-bg);color:var(--disabled-ink);border-color:var(--disabled-bg);cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px
}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover,button.primary:active{background:var(--accent-hover)}
button.selected,.selected{background:var(--accent-bg);border-color:var(--selection-line)}
input,textarea{padding:8px 12px;width:100%;border:1px solid var(--field);border-radius:4px}
textarea{resize:vertical;min-height:144px}
label{display:grid;gap:4px;font-weight:600}
h1,h2,h3,p{margin:0;min-width:0}
h1,h2{overflow-wrap:break-word;text-wrap:balance}
h1{font-size:27px;line-height:1.22}
h2{font-size:19px;line-height:1.32}
h3{font-size:16px}
small,.dim{color:var(--dim)}
.muted{color:var(--quiet)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;gap:12px;min-width:0}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.clip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:grid;gap:16px;min-width:0}
.design-tools{min-height:56px;padding:8px 16px;background:var(--tool);color:var(--bright);position:relative;z-index:4}
.design-tools label{display:flex;align-items:center;gap:8px;font-size:12px}
.design-tools strong{font-size:14px}
.design-tools select,.design-tools button{color:var(--ink);min-height:32px}
.design-tools :focus-visible{outline-color:var(--bright)}
.presentation{overflow:auto;height:calc(100dvh - 56px)}
.app{height:100%;min-height:440px;position:relative;overflow:hidden;background:var(--bg);container-type:inline-size;scrollbar-color:var(--quiet) var(--surface)}
.capture .design-tools{display:none}
.capture .presentation{height:100dvh}
.top{height:56px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo,.mark{display:grid;place-items:center;flex:none;border-radius:var(--radius)}
.logo{width:28px;height:28px;background:var(--ink);color:var(--bright)}
.mark{width:32px;height:32px;background:var(--surface);color:var(--ink)}
.glyph{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.top .brand{border:0;display:flex;gap:8px;align-items:center;padding:0;background:transparent}
.top .search{display:flex;width:224px;align-items:center;justify-content:space-between;color:var(--quiet)}
.shell{--rail-width:64px;display:flex;flex-direction:column;height:100%}
.shell>.top,.shell>.status{flex:none}
.frame{display:grid;grid-template-columns:var(--rail-width) 224px minmax(0,1fr) 248px;position:relative;flex:1;min-height:0}
.frame.no-side{grid-template-columns:var(--rail-width) 0 minmax(0,1fr) 248px}
.frame.no-inspector{grid-template-columns:var(--rail-width) 224px minmax(0,1fr) 0}
.frame.no-side.no-inspector{grid-template-columns:var(--rail-width) 0 minmax(0,1fr) 0}
.no-side .sidebar,.no-inspector .inspector{display:none}
.rail,.sidebar,.inspector{background:var(--surface);overflow:auto;min-width:0;min-height:0}
.rail{background:var(--panel);padding:8px 4px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.rail button{display:grid;justify-items:center;place-content:center;gap:4px;min-height:48px;font-size:12px;padding:4px;border-color:transparent;color:var(--quiet)}
.rail .active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:8px auto}
.sidebar,.inspector{border-right:1px solid var(--line);padding:16px 12px}
.inspector{border-right:0;border-left:1px solid var(--line)}
.sidebar h3,.inspector h3{margin-bottom:12px}
.sidebar button,.inspector summary{display:block;width:100%;text-align:left;margin-bottom:4px}
.sidebar button{border-color:transparent;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar button:hover,.sidebar button.selected{background:var(--panel);color:var(--ink)}
.sidebar .group{margin-block:16px 8px;color:var(--dim);font-size:12px}
.inspector details{border-top:1px solid var(--line);padding:12px 0}
.inspector summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:8px;color:var(--quiet)}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.crumbs{height:36px;flex:none;padding:0 20px;border-bottom:1px solid var(--line);line-height:36px;color:var(--quiet);font-size:12px}
.head{min-height:80px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.head p{color:var(--quiet);margin-top:4px}
.scroll{overflow:auto;min-height:0;flex:1}
.content{padding:20px 24px 28px;min-width:0}
.status{height:32px;background:var(--panel);border-top:1px solid var(--line);padding:0 16px;color:var(--quiet);font-size:12px}
.status .warning,.warning{color:var(--warn)}
.card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.card>h2,.card>h1{padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px}
.pad{padding:16px}
.stages{display:flex;gap:8px;overflow:auto;padding:12px}
.stages span,.tag{padding:4px 8px;border:1px solid var(--line);border-radius:var(--radius);color:var(--quiet);white-space:nowrap}
.tag.on,.stages .on{color:var(--accent);border-color:var(--selection-line);background:var(--accent-bg)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:12px 0;background:var(--panel);border-block:1px solid var(--line)}
.metric{padding:4px 12px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric strong{font:700 28px/1.25 var(--font-ui);font-variant-numeric:tabular-nums;display:block;margin-block:4px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.rows>div{padding:8px 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border:0}
.table-wrap{overflow:auto;min-width:0}
table{border-collapse:collapse;width:100%;text-align:left}
th,td{padding:8px 12px;border-bottom:1px solid var(--line)}
th{color:var(--quiet);font-size:12px;font-weight:600}
tr:last-child td{border-bottom:0}
.tabs{display:flex;align-items:center;gap:4px;overflow:auto}
.tabs button{background:transparent;border-color:transparent;border-bottom:2px solid transparent;border-radius:0;padding-inline:12px}
.tabs button.selected{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-bg)}
.reading{padding:24px;display:grid;gap:20px;max-width:760px;margin-inline:auto}
.reading p{color:var(--ink);line-height:1.9;font:17px/1.9 var(--font-reader)}
.project-list{height:100%;overflow:auto;padding:0 32px 40px;max-width:1328px;margin-inline:auto}
.library-top{height:64px;border-bottom:1px solid var(--line)}
.library-title{margin-block:24px 20px}
.library-title h1{font-size:36px}
.feature{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:28px}
.feature .feature-copy{padding:24px;display:grid;align-content:center;justify-items:start;gap:12px}
.feature h2{font-size:30px}
.feature figure{margin:0;position:relative;min-width:0;min-height:256px}
.feature img{width:100%;height:100%;min-height:256px;object-fit:cover;position:absolute;inset:0}
.feature figcaption{position:absolute;bottom:8px;right:12px;background:var(--matte);color:var(--matte-paper);padding:4px 8px;border-radius:var(--radius);font-size:12px}
.project-tools{margin-block:16px 12px;flex-wrap:wrap}
.project-tools input{max-width:344px}
.project-index{background:var(--panel);border-block:1px solid var(--line)}
.project-index .file-label{font-weight:700}
.project-index td:last-child{text-align:right}
.cover{display:grid;align-items:end;padding:8px;background:var(--matte);position:relative;overflow:hidden;color:var(--matte-paper)}
.cover.photo{background:var(--matte) url("ui-demo-railway.png") center/cover}
.cover .tag{justify-self:start;background:var(--matte);color:var(--matte-paper);border-color:var(--tool-border)}
.thumb{border-radius:var(--radius);min-height:112px}
.asset-card{padding:8px;display:grid;gap:8px}
.asset-card button{width:100%;text-align:left}
.camera-monitor{background:var(--matte);color:var(--matte-paper);padding:8px;border-radius:var(--radius)}
.camera-monitor .cover{min-height:260px}
.timeline{display:flex;gap:8px;overflow:auto;padding:12px}
.timeline button{display:grid;gap:4px;min-width:124px;padding:4px}
.timeline .thumb{min-height:64px}
.flow{min-width:0;min-height:480px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,332px);gap:12px}
.board{min-height:360px;display:flex;overflow:auto;padding:12px;background-color:var(--panel);background-image:linear-gradient(var(--flow-grid) 1px,transparent 1px),linear-gradient(90deg,var(--flow-grid) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--line);border-radius:var(--radius)}
.nodes{flex:0 1 320px;min-width:240px;position:relative;margin:auto}
.flow-links{position:absolute;inset:0;width:100%;height:100%;color:var(--quiet);pointer-events:none}
.flow-links path.edge{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.node{padding:6px 8px;min-width:0;overflow:hidden;position:absolute}
.node .line{gap:4px}
.node .glyph{width:14px;height:14px}
.node small{display:block;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .cover{min-height:128px}
.dock{flex:none;margin-left:var(--rail-width);background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;max-height:28%;overflow:auto}
.modal-layer{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);padding:12px;z-index:3}
.dialog{width:min(724px,100%);max-height:100%;overflow:auto;background:var(--raised);border:1px solid var(--line);border-radius:8px}
.dialog header,.dialog footer{padding:12px 20px;border-bottom:1px solid var(--line)}
.dialog footer{border-bottom:0;border-top:1px solid var(--line)}
.dialog>.stack{padding:16px 20px}
.wizard{max-width:1040px;margin-inline:auto;height:100%;overflow:auto;padding:0 24px 24px}
.wizard-body{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:0;gap:24px;padding-block:24px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{padding:8px 12px;border-radius:var(--radius);color:var(--quiet);border:1px solid var(--line)}
.step.current{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:700}
.wizard-form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.template{width:100%;text-align:left;padding:8px 12px;display:grid;gap:4px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.static-preview{padding:24px;max-width:960px;margin-inline:auto}
.static-preview img{max-width:100%;display:block;margin-top:16px}
.no-display{display:none!important}
[hidden]{display:none!important}
/* ---- v2.1 功能细化组件 ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--quiet);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.badge.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.badge.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.badge.busy{color:var(--accent);border-color:var(--selection-line);background:var(--accent-bg)}
.badge.info{color:var(--info);border-color:var(--info);background:var(--info-bg)}
.badge.idle{color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--accent);animation:pulse 1.2s infinite}
.dot.danger{background:var(--danger)}.dot.warn{background:var(--warn-line)}.dot.idle{background:var(--line)}
@keyframes pulse{50%{opacity:.35}}
.empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:28px 16px;color:var(--quiet)}
.empty .glyph{width:26px;height:26px;color:var(--dim)}
.empty strong{color:var(--ink);font-size:15px}
.empty.small{padding:12px 8px}
.gap{border:1px solid var(--warn-line);background:var(--warn-bg);padding:12px 16px;border-radius:4px;color:var(--warn)}
.note{color:var(--dim);font-size:12px;line-height:1.7}
.chipbar{display:flex;gap:8px;min-width:0;overflow-x:auto;padding:8px 0;position:relative}
.chipbar .chip{flex:none;white-space:nowrap;padding:4px 8px;border:1px solid var(--line);border-radius:8px;color:var(--quiet);min-height:24px;line-height:18px}
.chipbar .chip.on{color:var(--accent);border-color:var(--selection-line);background:var(--accent-bg);font-weight:600}
.summary-card{background:var(--surface);border:1px solid var(--selection-line);padding:12px 16px;border-radius:4px;max-width:720px}
.sflow{display:flex;align-items:stretch;overflow:auto;padding:12px}
.sflow .spill{display:grid;gap:4px;min-width:78px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);white-space:nowrap;background:var(--panel)}
.sflow .spill .code{font:700 11px/1.3 var(--font-mono);color:var(--dim)}
.sflow .spill .nm{font-size:11.5px;color:var(--quiet)}
.sflow .spill.done{border-color:var(--ok);background:var(--ok-bg)}
.sflow .spill.done .code{color:var(--ok)}
.sflow .spill.on{border-color:var(--selection-line);background:var(--accent-bg)}
.sflow .link{width:18px;align-self:center;height:1.5px;background:var(--line);flex:none}
.matrix td.n,.matrix th.n{text-align:center;font-variant-numeric:tabular-nums;padding:8px;white-space:nowrap}
.matrix td.n b{display:inline-block;min-width:24px;padding:0 8px;border-radius:4px;background:var(--surface);font-weight:600}
.matrix td.n b.has{background:var(--accent-bg);color:var(--accent)}
.product-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.product-row:last-child{border-bottom:0}
.product-name{flex:1 0 136px;gap:8px}
.product-thumb{display:grid;place-items:center;width:40px;height:28px;flex:none;border-radius:4px}
.product-thumb.pending-art{border:1px solid var(--line)}
.product-actions{gap:8px;margin-left:auto}
.film{display:flex;gap:8px;overflow:auto;padding:12px}
.film .cell{width:118px;flex:none;display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);text-align:left}
.film .cell.selected{border-color:var(--selection-line);background:var(--accent-bg)}
.film .cell .shot-thumb{min-height:0;height:60px;border-radius:4px;display:grid;place-items:center;font-size:11px}
.film .fmeta{display:flex;align-items:center;gap:7px}
.film .fmeta .dot{margin-left:auto}
.art{background:repeating-linear-gradient(135deg,var(--art-warm-1),var(--art-warm-1) 12px,var(--art-warm-2) 12px,var(--art-warm-2) 24px);color:var(--matte-paper)}
.art.cool{background:repeating-linear-gradient(135deg,var(--art-cool-1),var(--art-cool-1) 12px,var(--art-cool-2) 12px,var(--art-cool-2) 24px)}
.pending-art{background:var(--surface);color:var(--dim)}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sheet-cell{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.sheet-cell .pic{height:150px;display:grid;place-items:center;color:var(--matte-paper);position:relative}
.sheet-cell .lbl{padding:8px;font-size:12px;color:var(--quiet);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.sheet-bar{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:12px;color:var(--quiet);flex-wrap:wrap}
.field{display:grid;gap:4px}
.field .hint{color:var(--dim);font-size:12px;font-weight:400}
.seg{display:flex;overflow:auto}
.seg button{border-radius:0;border-right-width:0;flex:none}
.seg button:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.seg button:last-child{border-radius:0 var(--radius) var(--radius) 0;border-right-width:1px}
.seg button.selected{color:var(--accent);border-color:var(--selection-line);background:var(--accent-bg)}
.switch{position:relative;width:34px;height:19px;min-height:19px;padding:0;border-radius:10px;background:var(--disabled-bg);border:1px solid var(--line);flex:none}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:16px}
.line.wrap{flex-wrap:wrap;align-items:flex-start}
.line.wrap small{flex:1 1 220px;min-width:0}
.wrap-any{display:block;white-space:normal;overflow-wrap:anywhere}
.toast{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);background:var(--matte);color:var(--matte-paper);padding:8px 16px;border-radius:var(--radius);z-index:5;max-width:80%;font-size:13px}
.fv-stage{aspect-ratio:16/10;max-width:620px;width:100%;margin-inline:auto;border-radius:var(--radius);overflow:hidden;position:relative;background:var(--matte);display:grid;place-items:center}
.fv-stage .zoomer{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.fv-stage img{width:100%;height:100%;object-fit:contain;transition:transform .12s}
.fv-tools{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:8px 0}
.fv-tools button{min-height:28px;padding:4px 8px}
.logline{font:13px/1.9 var(--font-mono);white-space:pre-wrap;word-break:break-all}
.scroll-y{overflow:auto;min-height:0;max-height:320px}
.pairline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pairline:last-child{border-bottom:0}
.layer-node{display:grid;gap:4px;min-width:92px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);text-align:left}
.layer-node .pic{height:50px;border-radius:4px;display:grid;place-items:center;color:var(--matte-paper);font-size:10px;overflow:hidden}
.layer-node .lbl{font-size:11px;font-weight:700;display:flex;align-items:center;gap:8px}
.layer-chain{display:flex;align-items:center;gap:0;overflow:auto;padding:12px 0}
.layer-chain .link{width:22px;height:1.5px;background:var(--line);flex:none}

const NOVEL_MODES=["章节","设定","初始化","流水线","评审","模型","状态","自动"];
const NOVEL_GAPS={
  2:"暂无初始化记录",
  4:"暂无评审记录",
  5:"暂无模型配置",
  6:"暂无本章角色状态记录",

function novel(){
  const mode=state.section??0;
  const ci=Math.max(0,Math.min(DB.chapters.length-1,state.selection||0));
  state.selection=ci;
  const c=DB.chapters[ci], cid=c[0];
  const chips='<div class="chipbar" role="tablist" aria-label="章节">'+DB.chapters.map((x,j)=>'<button type="button" class="chip'+(j===ci?" on":"")+'" data-action="item:'+j+'" title="'+escape(x[3])+'">第 '+x[2]+' 章</button>').join("")+'</div>';
  const rail='<section class="card"><h2>章节属性</h2><div class="pad">'+kv([
    ["章节","第 "+c[2]+" 章"],["标题",escape(c[3])||"—"],["字数",c[7]>0?String(c[7]):"未统计"],
    ["状态",chapterStatusTag(c)],["更新",'<span class="mono">'+timeText(c[8])+'</span>'],["本章镜头",String(shotsOfChapter(cid).length)]
  ])+'<div class="note" style="margin-top:8px">数据源：<span class="mono">'+escape(DB.dbPath)+'</span></div></div></section>';
  let left="";
  if(mode===0){
    const st=statusLabel(c[4]);
    left='<article class="card reading"><div class="line between"><h1>第 '+c[2]+' 章 · '+escape(c[3])+'</h1>'+badge(st.tag,st.tone)+'</div>'+
      '<small>'+(c[7]>0?c[7]+" 字":"未统计")+' · 更新 '+timeText(c[8])+'</small>'+
      (c[5]?'<div class="summary-card">本章目标 · '+escape(c[5])+'</div>':'')+
      (c[6]?'<p>'+escape(c[6])+'</p>':emptyBox("text","本章尚无正文","可以切换到其他章节阅读。"))+
      '</article>';
  }else if(mode===1){
    left=card("设定集",'<div class="note">共 '+DB.entities.length+' 个实体</div><div class="grid" style="margin-top:12px">'+
      DB.entities.map((e,i)=>'<article class="card asset-card"><button type="button" data-action="asset:'+i+'"><strong class="clip">'+escape(e[2]||"—")+'</strong><small>'+escape(kindLabel(e[1]))+' · '+escape(dash(e[4]))+'</small><small class="clip">'+escape(e[3]||"—")+'</small></button></article>').join("")+'</div>');
  }else if(mode===3){
    const vRows=V_STAGES.map(([code,name])=>{
      const n=stageCount(cid,code);
      return [code,escape(name),badge(n>0?"完成":"待执行",n>0?"ok":"idle"),'<span class="mono">artifacts/</span>'+(n?' ×'+n:"")];
    });
    left=card("正文链 T1–T17 · 阶段定义",pillFlow(T_STAGES.map((t,i)=>({code:"T"+(i+1),name:t.split(" ")[1],state:""})))+
      table(["阶段","名称","状态","产物"],T_STAGES.map((t,i)=>["T"+(i+1),escape(t.split(" ")[1]),badge("待执行","idle"),'<span class="mono">artifacts/</span>']))+
      '<div class="note">在「总控」查看阶段产物。</div>')+
      card("当前章 · V 阶段",pillFlow(V_STAGES.slice(0,8).map(([code,name])=>({code,name,state:stageState(cid,code)})))+
        table(["阶段","名称","状态","产物条数"],vRows));
  }else{
    left='<section class="card pad">'+emptyBox("sparkles",NOVEL_GAPS[mode]||"暂无记录","")+'</section>';
  }
  return tabbar(NOVEL_MODES,mode)+chips+'<div class="split">'+left+'<aside class="stack">'+rail+'</aside></div>';
}

  const shown=DB.entities.map((e,i)=>[e,i]).filter(([e])=>!state.assetFilter||e[1]===state.assetFilter);
  const ready=DB.vassets.filter(v=>v[5]==="READY").length;
  if(view===0){
    const grid=shown.length?'<div class="grid">'+shown.map(([e,i])=>{
      const v=vassetOfEntity(e[0]);
      return '<article class="card asset-card"><div class="cover art thumb">'+tag(kindLabel(e[1]))+'</div>'+

    }).join("")+'</div>':emptyBox("masks",state.assetFilter?"这一类还没有实体":"还没有实体资产",state.assetFilter?"在左侧侧栏换回「全部」看看这个工程里有哪些实体":"跑一次初始化与资产流水线后这里才有内容。");
    return tabbar(["总览","详情"],0)+chipRow+
      '<div class="line between"><h2>实体资产</h2><small>'+ready+'/'+DB.vassets.length+' 就绪 · 缩略图为示意</small></div>'+grid;
  }
  const ei=Math.max(0,Math.min(DB.entities.length-1,state.selection||0));
  const e=DB.entities[ei], v=vassetOfEntity(e[0]);
  const layers=v?layersOfAsset(v[0]):[];
  const done=layers.filter(a=>a[3]==="DONE").length;
  const degraded=layers.some(a=>a[4]===1);
  const filteredOut=state.assetFilter&&e[1]!==state.assetFilter;
  const chain='<div class="layer-chain">'+LAYERS.map(([key,label],i)=>{
    const a=layers.find(x=>x[2]===key);

  }).join("")+'</div>';
  return tabbar(["总览","详情"],1)+
    (filteredOut?'<div class="gap">当前这一项不在「'+escape(kindLabel(state.assetFilter))+'」的筛选结果里</div>':"")+

function flowNodes(video){
  const c=curChapter(), list=curShots();
  const imgCount=DB.gen.filter(g=>g[9]==="asset"&&g[13]!=="FAILED").length;
  const shotImgs=list.filter(s=>{const g=genOfShot(s[0]);return g&&g[13]!=="FAILED";}).length;
  if(video) return [
    {icon:"image",label:"首帧",sub:"—",state:"todo"},{icon:"image",label:"尾帧",sub:"—",state:"todo"},
    {icon:"video",label:"H3 生成",sub:list.length+" 镜 / 共 "+chapterTotalDuration(c[0])+"s",state:"todo"},
    {icon:"refresh",label:"RIFE 补帧",sub:"—",state:"todo"},{icon:"file",label:"编码",sub:"—",state:"todo"}
  ];
  return [
    {icon:"novel",label:"章节",sub:"第 "+c[2]+" 章 · "+c[3],state:"done"},
    {icon:"text",label:"提示词",sub:"本章 "+list.length+" 镜",state:"todo"},
    {icon:"masks",label:"角色参考",sub:imgCount?(imgCount+" 个实体已出图"):"还没有实体出图",state:imgCount?"done":"todo"},
    {icon:"compare",label:"姿势骨架",sub:"—",state:"todo"},
    {icon:"chip",label:"KSampler",sub:"队列里没有任务",state:"todo"},
    {icon:"image",label:"VAE 解码",sub:"—",state:"todo"},
    {icon:"check",label:"一致性校验",sub:"—",state:"todo"},
    {icon:"download",label:"落盘",sub:shotImgs?"本章已有 "+shotImgs+" 镜出图":"—",state:shotImgs?"done":"todo"}
  ];
}
function flowDiagram(video){
  const nodes=flowNodes(video);
  // 卡片和连线共用同一套坐标。画布变窄时只缩放横向，行高和间距保持可读。
  const width=320, nodeWidth=144, nodeHeight=80, rowStep=104;
  const left=0, right=width-nodeWidth, center=right/2;
  const columns=video?[left,right,center,center,center]:[left,right,right,left,left,right,right,left];
  const boxes=nodes.map((_,i)=>({x:columns[i],y:(video?Math.max(0,i-1):Math.floor(i/2))*rowStep}));
  const height=boxes.at(-1).y+nodeHeight;
  // 依赖与原生 FlowGraph 中同名的节点一致，出片的两路输入汇入 H3。
  const links=video?[[0,2],[1,2],[2,3],[3,4]]:nodes.slice(1).map((_,i)=>[i,i+1]);
  const arrowId=video?"video-link-arrow":"image-link-arrow";
  const edges=links.map(([from,to])=>{
    const a=boxes[from], b=boxes[to];
    let path;
    if(a.y===b.y){
      const forward=a.x<b.x, y=a.y+nodeHeight/2;
      path='M '+(forward?a.x+nodeWidth:a.x)+' '+y+' H '+(forward?b.x-3:b.x+nodeWidth+3);
    }else{
      const mid=a.y+nodeHeight+(rowStep-nodeHeight)/2;
      path='M '+(a.x+nodeWidth/2)+' '+(a.y+nodeHeight)+' V '+mid+' H '+(b.x+nodeWidth/2)+' V '+(b.y-3);
    }
    return '<path class="edge" d="'+path+'" marker-end="url(#'+arrowId+')"><title>'+escape(nodes[from].label+' → '+nodes[to].label)+'</title></path>';
  }).join("");
  const cards=nodes.map((n,i)=>{
    const {x,y}=boxes[i];
    return '<div class="node card" style="left:'+(x/width*100)+'%;top:'+y+'px;width:'+(nodeWidth/width*100)+'%;height:'+nodeHeight+'px">'+
      '<div class="line">'+glyph(n.icon)+'<strong class="clip">'+escape(n.label)+'</strong></div><small title="'+escape(n.sub)+'">'+escape(n.sub)+'</small>'+
      (n.state==="done"?badge("完成","ok"):badge("待执行","idle"))+'</div>';
  }).join("");
  return '<div class="board"><div class="nodes" style="height:'+height+'px"><svg class="flow-links" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none" role="img" aria-label="流程依赖">'+
    '<defs><marker id="'+arrowId+'" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 6 3 L 0 6 Z" fill="currentColor"/></marker></defs>'+edges+'</svg>'+cards+'</div></div>';
}

      '<div class="fv-tools">'+btn(glyph("plus")+" 放大","zoom:in")+btn(glyph("minus")+" 缩小","zoom:out")+btn(glyph("target")+" 适应窗口","zoom:fit")+btn(glyph("search")+" 放大镜 3×","zoom:lens",viewerUI.lens?"selected":"")+'<span class="mono">'+Math.round(viewerUI.zoom*100)+'%</span></div>'+
      '<div class="note">'+escape(VIEWER_PAGES[page][0]+(layer?" · "+layer[3]:""))+' · 示例剧照</div>';
  }
  return header+'<div class="stack">'+body+'</div>';
}

/* ===== 底栏（Shell_Dock，四页签） ===== */
function dockHtml(){
  const tab=state.dockTab??0;
  const bodies=[
    emptyBox("chip","暂无任务 · Comfy 未配置","可在桌面端设置中填写 ComfyUI 地址。",true),
    '<div class="logline">打开项目 第七封信\n已读取 '+DB.chapters.length+' 章 · '+DB.shots.length+' 镜 · '+DB.entities.length+' 实体\nComfyUI 未配置</div>',
    table(["文件名","扩展","位置"],DB.gen.map(g=>['<span class="mono">'+escape(g[8].split("/").pop())+'</span>',"PNG",'<span class="mono clip">'+escape(g[8].split("/").slice(0,-1).join("/")||"/")+'</span>',btn(glyph("chev"),"demo:open-product")]))+
      '<div class="note">共 '+DB.gen.length+' 个产物</div>',
    emptyBox("compare","尚无校验报告","完成连续性校验后可在此查看逐项结论。",true)
  ];
  return '<section class="dock"><div class="tabs">'+["任务队列","日志","产物","校验报告"].map((t,i)=>btn(t,"dock-tab:"+i,tab===i?"selected":"")).join("")+'</div>'+bodies[tab]+'</section>';
}

/* ===== 外壳 ===== */
const headers={
 overview:["全流程总控台","阶段进度、预算、账本与最近产物"],novel:["小说工作区","切换章节，阅读正文并检查设定"],assets:["视觉资产","查找实体、对照设定图和派生结果"],
 shots:["分镜工作区","对照镜头画面、机位、时长和连续性"],image:["出图流程","分镜图绑定、图评审与生成结果"],video:["出片流程","首尾帧链、视频任务和成片"],gallery:["组件画廊","预览当前主题的组件和交互状态"]
};
function sidebarHtml(id){
  const ci=state.chapter||0;
  if(id==="assets"){
    const counts=kindCounts();
    const groups=[...counts.entries()].map(([k,n])=>'<div class="group">'+escape(kindLabel(k))+' '+n+'</div>'+
      DB.entities.map((e,i)=>[e,i]).filter(([e])=>e[1]===k).map(([e,i])=>btn(escape(e[2]||"—"),"asset:"+i,i===state.selection?"selected":"")).join("")).join("");
    return '<h3 class="line between"><span>实体资产</span><small>'+DB.vassets.filter(v=>v[5]==="READY").length+'/'+DB.vassets.length+' 就绪</small></h3><input id="sidebar-filter" placeholder="筛选…" aria-label="筛选实体">'+groups;
  }
  const tree=DB.volumes.map(v=>{
    const chs=DB.chapters.filter(c=>c[1]===v[0]);
    return '<div class="group">'+escape(v[1])+'</div>'+chs.map(c=>{
      const j=DB.chapters.indexOf(c);
      const sel=id==="novel"?(j===state.selection):(j===ci);
      const shots=(id!=="overview")?shotsOfChapter(c[0]):[];
      return btn(escape("第 "+c[2]+" 章 · "+c[3]),(id==="novel"?"item:":"chap:")+j,sel?"selected":"")+
        (sel?shots.map((s,k)=>btn(escape(shotCode(s[0])+" · "+s[3]),"item:"+k,k===state.selection?"selected":"")).join(""):"");
    }).join("");
  }).join("");
  return '<h3>项目资料</h3><input id="sidebar-filter" placeholder="筛选…" aria-label="筛选资料">'+tree;
}
function inspectorHtml(id){
  const c=curChapter(), sh=curShot();
  if(id==="assets"){const e=curEntity(),va=vassetOfEntity(e[0]);return '<h3>检查器</h3><details open><summary>属性</summary>'+kv([["当前项目","第七封信"],["工作区",escape(headers[id]?headers[id][0]:"—")],["实体名",escape(e[2]||"—")],["类别",escape(kindLabel(e[1]))],["资产状态",va?assetStatusTag(va[5]):badge("无视觉资产","idle")]])+'</details><details open><summary>预览</summary><div class="cover art thumb">'+tag("示意 · 非本工程出图结果")+'</div></details><details><summary>关联</summary><small>按当前实体查找</small></details>';}
  return '<h3>检查器</h3><details open><summary>属性</summary>'+kv([
    ["当前项目","第七封信"],["工作区",escape(headers[id]?headers[id][0]:"—")],
    ["章节","第 "+c[2]+" 章"],["标题",escape(c[3])],
    ["镜头",sh?shotCode(sh[0]):"—"],["设定状态",sh?escape(dash(sh[8])):"—"]
  ])+'</details><details open><summary>预览</summary><div class="cover art thumb">'+tag("示意 · 非本工程出图结果")+'</div></details><details><summary>关联</summary><small>按当前章节或镜头查找</small></details>';
}
function shell(id){
  const ids=["overview","novel","assets","shots","image","video","gallery"];
  const label=x=>pages.find(([key])=>key===x)[1];
  const nav=ids.map(x=>btn(glyph(x)+"<span>"+(x==="gallery"?"组件":label(x))+"</span>",x,id===x?"active":"")).join("");
  const panels=[["panel","侧栏"],["dock","底栏"],["inspect","检查器"]].map(([x,t])=>btn(glyph(x)+"<span>"+t+"</span>",x)).join("");
  const views={overview,novel,assets,shots:shotsView,image:imageView,video:videoView,gallery};
  const sh=curShot();
  let context=headers[id][0];
  if(id==="novel")context="第 "+DB.chapters[Math.max(0,Math.min(DB.chapters.length-1,state.selection||0))][2]+" 章";
  else if(id==="assets")context=state.section===1?curEntity()[2]||"详情":"总览";
  else if(["shots","image","video"].includes(id))context=sh?shotCode(sh[0]):"第 "+curChapter()[2]+" 章";
  const headTitle=id==="shots"&&sh?(shotCode(sh[0])+" · "+sh[3]):headers[id][0];
  const headSub=id==="shots"?"本章 "+curShots().length+" 个镜头":headers[id][1];
  const headExtra=id==="shots"?badge(dash(sh?sh[8]:"—"),"idle")+(btn("重新读取","demo:reload","primary")):"";
  const inner=(id==="image"||id==="video")
    ? '<div class="content">'+views[id]()+'</div>'
    : '<div class="head line"><span class="mark">'+glyph(id)+'</span><div class="grow clip"><h1>'+escape(headTitle)+'</h1><p class="clip">'+escape(headSub)+'</p></div>'+headExtra+'</div><div class="content stack">'+views[id]()+'</div>';
  return '<div class="shell"><header class="top line">'+btn('<span class="logo">'+glyph("logo")+'</span><strong class="brand-name">ShineTV Studio</strong>',"hub","brand")+btn("第七封信 ▾","hub","project-button")+btn(glyph("search")+'<span class="grow">搜索命令</span><small>Ctrl K</small>',"commands","search")+'<div class="grow"></div><small class="comfy">Comfy 未配置</small>'+btn(glyph("settings"),"settings")+btn("运行","dock","primary")+'</header>'+
  '<div class="frame '+(state.side?"":"no-side")+' '+(state.inspector?"":"no-inspector")+' '+(state.peek==='panel'?'panel-peek':state.peek==='inspect'?'inspect-peek':'')+'"><nav class="rail" aria-label="工作区">'+nav+'<hr>'+panels+'</nav>'+
  '<aside class="sidebar">'+sidebarHtml(id)+'</aside>'+
  '<main class="work"><div class="crumbs clip">第七封信　›　'+label(id)+'　›　'+escape(context)+'</div><div class="scroll">'+inner+'</div></main>'+
  '<aside class="inspector">'+inspectorHtml(id)+'</aside></div>'+
  (state.dock?dockHtml():"")+'<footer class="status line between"><span>Comfy 未配置　　队列 0</span><span class="warning">制作阶段暂不可运行</span><span>纸墨</span></footer></div>'+toastHtml();
}
function gallery(){
  const deepLinks=[
    ["novel&tab=0..7","小说 8 模式：章节 / 设定 / 初始化 / 流水线 / 评审 / 模型 / 状态 / 自动"],
    ["assets&tab=0/1","资产总览 / 详情"],
    ["image&tab=0..3","出图：绑定 / 批量出图 / 图评审 / 结果"],
    ["video&tab=0..2","出片：首尾帧链 / 视频任务 / 成片"],
    ["overview&dock=0..3","总控 + 底栏四页签"],
    ["viewer&tab=0/1","查看器：图片舞台 / 联系表"],
    ["settings","设置"],["report","校验报告"]
  ];
  return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(225px,1fr))">'+card("按钮",'<div class="line">'+btn("主操作","", "primary")+btn("次操作")+'<button type="button" disabled>禁用</button></div>')+card("标签",'<div class="line">'+badge("已完成","ok")+badge("待处理")+badge("失败","danger")+badge("运行中","busy")+badge("已过期","warn")+'</div>')+card("表单",'<label>项目名称<input placeholder="输入名称"></label>')+card("分段控件",tabbar(["详情","总览","预览"],0))+card("开关",'<div class="line between"><span>MiMo Token Plan</span><button type="button" class="switch" role="switch" aria-checked="true" aria-label="示例开关" data-action="noop"></button></div>')+card("表格",table(["名称","状态"],[["章节","已读取"],["出图","待处理"]]))+card("空状态",'<div class="empty">'+glyph("sparkles")+'<strong>还没有可显示的项目</strong><small>尚无数据时用空态，不摆假数据。</small></div>')+'</div>'+
  card("深链接索引（?capture=1&screen=…）",'<div class="rows">'+deepLinks.map(([q,d])=>'<div class="line between"><span class="mono clip">?screen='+escape(q)+'</span><small class="clip">'+escape(d)+'</small></div>').join("")+'</div><div class="note">另有 ?item=N（选中项）、?chapter=N（当前章）、?compact=1（窄窗口）、?dock=N（底栏页签）。</div>');
}
function render(){
  const id = state.screen;
  const app=document.querySelector("#app");
  app.style.width=state.compact?"min(900px,100%)":"100%";
  screenSel.value=id;
  if(id==="viewer"&&state.section!=null)state.viewerTab=state.section;
  let html;
  if(id==="hub"||steps.includes(id)||id==="open"){
   html=steps.includes(id)?wizard(id):hub();
   if(id==="open") html+=modal("打开项目",project.map(x=>btn(x,"overview","template")).join("")+
     '<label>浏览本地项目目录<input id="browse-directory" type="file" webkitdirectory aria-describedby="browse-status"></label><small id="browse-status">请选择包含 project.json 的目录。</small>',btn("取消","hub"),"hub");
  } else if(headers[id]) {
   html=shell(id);
  } else if(id==="settings"){
   html=shell("overview")+modal("项目与服务设置",settingsBody(),"","overview");
  } else if(id==="report"){
   html=shell("shots")+modal("连续性 C1-C12 · 逐项结论",reportBody(),"","shots");
  } else if(id==="viewer"){
   html=shell("assets")+modal2(viewerBody(),"assets");
  } else {
   html=shell("overview")+modal("命令面板",'<input id="command-filter" aria-label="搜索命令" placeholder="搜索工作区或操作…"><div id="command-list" class="stack">'+pages.slice(6,13).map(([x,n])=>btn(n,x,"template")).join("")+'</div>',"", "overview");
  }
  app.innerHTML=html;
  const selectedChip=app.querySelector(".chipbar .chip.on");
  if(selectedChip){
   const bar=selectedChip.parentElement;
   bar.scrollLeft=Math.max(0,selectedChip.offsetLeft+selectedChip.offsetWidth-bar.clientWidth);
  }
  const activeDialog=app.querySelector(".dialog");
  if(activeDialog){
   for(const sibling of app.children){
     if(!sibling.classList.contains("modal-layer")) sibling.inert=true;
   }
   activeDialog.querySelector("input:not([type=file]), button")?.focus({preventScroll:true});
  }
}
function modal2(body,close){
  return '<div class="modal-layer"><section class="dialog" role="dialog" aria-modal="true" aria-label="媒体查看器" style="width:min(720px,100%)"><div class="stack">'+body+'</div>'+
    '<footer class="line between"><span class="note">滚轮缩放 · 拖动平移 · ←→ 切图 · 放大镜 3×</span><div class="line">'+btn(glyph("x")+" 关闭 (Esc)",close)+'</div></footer></section></div>';
}
const DEMO_MSG={
  "save-as":"当前预览无法另存图片。",
  "copy":"当前预览无法复制图片。",
  "export-sheet":"当前预览无法导出整版。",
  "regen-sheet":"当前预览无法重新生成整版。",
  "submit-batch":"当前预览无法提交批量出图。",
  "rerun":"当前预览无法重新出图。",
  "reload":"当前预览无法刷新项目数据。",
  "open-product":"打开产物：需要用系统默认程序打开（演示）"
};
function go(id){ state.screen=id;state.section=null;state.selection=0;state.peek=null;render(); }
document.querySelector("#scale").onchange=e=>{document.querySelector("#app").style.zoom=e.target.value;};
screenSel.onchange=e=>go(e.target.value);
document.querySelector("#compact").onclick=()=>{state.compact=!state.compact;render();};
document.querySelector("#app").addEventListener("click",e=>{
  const target=e.target.closest("[data-action]");if(!target)return;
  const [kind,value]=target.dataset.action.split(":");
  if(kind==="next"){
   const i=Number(value);
   if(i===1&&!state.name.trim()||i===2&&[...state.idea].length>200){
     document.querySelector("#form-status").textContent=i===1?"请输入项目名称":"创意须在 200 字以内";return;
   }
   go(i===3?"overview":steps[i+1]);return;
  }
  if(kind==="section"||kind==="template"||kind==="item"){
   state[kind==="item"?"selection":"section"]=Number(value);
   if(kind==="item"&&(state.screen==="shots"||state.screen==="image"||state.screen==="video"))viewerUI.page=0;
   render();return;
  }
  if(kind==="chap"){state.chapter=Number(value);state.selection=0;render();return;}
  if(kind==="kind"){state.assetFilter=value||"";render();return;}
  if(kind==="dock-tab"){state.dockTab=Number(value);render();return;}
  if(kind==="asset"){state.screen="assets";state.section=1;state.selection=Number(value);render();return;}
  if(kind==="viewer"){state.screen="viewer";state.viewerTab=Number(value)||0;state.section=state.viewerTab;state.peek=null;render();return;}
  if(kind==="close"){go(value||"overview");return;}
  if(kind==="demo"){
   const sh=curShot();
   const msg=value==="rerun"?(sh?shotCode(sh[0])+" ":"")+(DEMO_MSG.rerun):DEMO_MSG[value];
   setToast(msg||"演示");return;
  }
  if(kind==="zoom"){
   if(value==="in")viewerUI.zoom=Math.min(8,viewerUI.zoom*1.12);
   else if(value==="out")viewerUI.zoom=Math.max(.25,viewerUI.zoom/1.12);
   else if(value==="fit")viewerUI.zoom=1;
   else viewerUI.lens=!viewerUI.lens;
   render();return;
  }
  if(kind==="pager"){turnViewerPage(Number(value));return;}
  if(kind==="provider"||kind==="protocol"){settingsUI[kind]=Number(value);render();return;}
  if(kind==="switch"){settingsUI[value]=!settingsUI[value];render();return;}
  if(kind==="panel"||kind==="inspect"||kind==="dock"){
   const key={panel:"side",inspect:"inspector",dock:"dock"}[kind];state[key]=!state[key];if(kind!=="dock")state.peek=state.peek===kind?null:kind;render();return;
  }
  if(kind==="alphabetical"||kind==="recent"){
   const grid=document.querySelector(".project-grid");
   const cards=[...grid.children];cards.sort((a,b)=>kind==="recent"?project.indexOf(a.dataset.name)-project.indexOf(b.dataset.name):a.dataset.name.localeCompare(b.dataset.name,"zh-CN"));
   grid.append(...cards);return;
  }
  if(kind==="noop"){return;}
  if(headers[kind]||pages.some(([id])=>id===kind))go(kind);
});
document.querySelector("#app").addEventListener("input",e=>{
  const field=e.target.dataset.field;
  if(field){
   state[field]=e.target.value;
   if(field==="idea")document.querySelector("#idea-count").textContent=[...state.idea].length+" / 200";
  }else if(e.target.id==="project-filter"){
   const cards=[...document.querySelectorAll(".project")];cards.forEach(c=>c.hidden=!c.dataset.name.includes(e.target.value));
   document.querySelector("#project-count").textContent="共 "+cards.filter(c=>!c.hidden).length+" 个示例项目";
  }else if(e.target.id==="sidebar-filter"){
   document.querySelectorAll(".sidebar button").forEach(b=>b.hidden=!b.textContent.includes(e.target.value));
  }else if(e.target.id==="command-filter"){
   document.querySelectorAll("#command-list button").forEach(b=>b.classList.toggle("no-display",!b.textContent.includes(e.target.value)));
  }
});
document.querySelector("#app").addEventListener("change",e=>{
  if(e.target.id==="browse-directory"){
   const hasProject=[...e.target.files].some(f=>f.name==="project.json"&&f.webkitRelativePath.split("/").length===2);
   if(hasProject)go("overview");
   else document.querySelector("#browse-status").textContent="所选目录的根级没有 project.json。";
  }
});
document.addEventListener("keydown", e=>{
  const dialog=document.querySelector(".dialog");
  if(dialog&&e.key==="Tab"){
    const controls=[...dialog.querySelectorAll("button:not([disabled]),input,select,textarea")].filter(x=>!x.classList.contains("no-display"));
    const edge=e.shiftKey?controls[0]:controls.at(-1);
    if(edge&&document.activeElement===edge){e.preventDefault();(e.shiftKey?controls.at(-1):controls[0])?.focus();return;}
  }
  if(state.screen==="viewer"&&["ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();turnViewerPage(e.key==="ArrowRight"?1:-1);return;
  }
  if(e.ctrlKey&&["k","b","i","j"].includes(e.key.toLowerCase())){
    e.preventDefault();const key=e.key.toLowerCase();
    if(key==="k"){go("commands");document.querySelector("#command-filter").focus();}
    else {const field={b:"side",i:"inspector",j:"dock"}[key];state[field]=!state[field];render();}
  }
  if(e.key==="Escape"&&!headers[state.screen])go(steps.includes(state.screen)||state.screen==="open"?"hub":"overview");
});
render();
</script>
</html>
